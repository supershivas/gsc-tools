<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factsheet creator — GSC tools</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/mobile.css">
<link rel="stylesheet" href="../css/shell.css">
</head>
<body>
<header id="app-header"></header>
<div class="fs-tabs-bar" id="fsTabs"></div>
<div class="app">
  <aside class="panel tree" id="tree"></aside>
  <main class="stage-wrap">
    <div class="bar">
      <div class="gauges" id="gauges"></div>
    </div>
    <div id="warnings" class="warnings"></div>
    <div class="stage" id="stage"></div>
  </main>
  <aside class="panel props" id="props"></aside>
</div>
<dialog id="exportDlg">
  <h3>Exporter en PDF</h3>
  <h4>Format de la feuille</h4>
  <div id="exportOpts"></div>
  <h4>Profil du PDF</h4>
  <div id="exportProfile"></div>
  <p class="tip">Fichier vectoriel généré par l’app, polices incorporées, TrimBox et BleedBox renseignées. <b>CMJN</b> pour l’imprimeur : couleurs exactes de la palette, images importées converties par une conversion simple. <b>RVB</b> pour l’écran.</p>
  <div class="row"><button type="button" id="exportCancel">Annuler</button><button type="button" class="primary" id="exportGo">Télécharger le PDF</button></div>
</dialog>
<script>
/* Démarrage versionné : GitHub Pages garde les fichiers 10 min en cache ; avec ?v=<version> une mise à jour n'est jamais servie avec d'anciens CSS/JS */
(async () => {
  let v = Date.now(); try { v = (await (await fetch('../version.json', { cache: 'no-store' })).json()).version || v; } catch (e) { /* hors ligne */ }
  await Promise.all(['css/fonts.css', 'css/doc.css', 'css/sel.css', 'css/app.css'].map(href => new Promise(res => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = `${href}?v=${v}`; l.onload = l.onerror = res; document.head.append(l);
  })));
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = `app.js?v=${v}`; s.onload = res; s.onerror = rej; document.body.append(s); });
  await window.FS_READY; // l'éditeur lit d'abord l'espace de travail (onglets, IndexedDB)
  const { initShell } = await import(`../js/shell.js?v=${v}`);
  const ui = window.FS_UI || {};
  initShell({ sub: 'Factsheet creator', menus: ui.menus, center: ui.center, settingsExtra: ui.settings, exportData: ui.exportData });
})();
</script>
</body>
</html>
